services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: analog
      POSTGRES_USER: analog
      POSTGRES_PASSWORD: analog
    ports:
      - "5432:5432"
    volumes:
      - analog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analog -d analog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  analog_postgres_data:
